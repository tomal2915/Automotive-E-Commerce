name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["client/**"]
  pull_request:
    branches: [main]
    paths: ["client/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A placeholder API URL — the build just needs to succeed
          # syntactically/type-wise, it doesn't actually call this URL
          VITE_API_URL: https://api.example.com/api/v1
